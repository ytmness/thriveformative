<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thrive Formative</title>
</head>
<body style="margin:0; padding:0; background-color:#f7f5f0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f7f5f0; min-height:100vh;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px; background-color:#f2ece6; border-radius:16px; border:1px solid rgba(81,78,77,0.2); box-shadow:0 4px 24px rgba(26,26,26,0.06);">
          <tr>
            <td style="padding:32px 32px 24px; text-align:center; border-bottom:1px solid rgba(81,78,77,0.12);">
              <img src="{{ .SiteURL }}/logos/Logo-Golden-Sand-color-06.png" alt="Thrive Formative" width="160" height="auto" style="display:inline-block; max-height:56px; width:auto;" />
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 8px; font-size:1.5rem; font-weight:600; color:#1a1a1a; letter-spacing:0.02em;">Confirma tu cuenta</h1>
              <p style="margin:0 0 24px; font-size:0.9375rem; color:#514e4d; line-height:1.5;">Gracias por registrarte en Thrive Formative. Usa el código siguiente para activar tu cuenta:</p>
              <p style="margin:0 0 24px; font-size:1.5rem; font-weight:600; letter-spacing:0.25em; color:#d4a473; text-align:center;">{{ .Token }}</p>
              <p style="margin:0; font-size:0.875rem; color:#514e4d;">Introduce este código de 6 dígitos en la página de registro. Si no solicitaste este correo, puedes ignorarlo.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 32px; text-align:center; border-top:1px solid rgba(81,78,77,0.08);">
              <p style="margin:0; font-size:0.75rem; color:#514e4d;">Thrive Formative · Wellness from within</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
