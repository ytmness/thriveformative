# Respuesta cuando Node no está disponible (reinicio PM2, deploy, etc.).
# Cache-Control: no-store evita que el navegador guarde el 502/503 y lo muestre tras recuperarse.
location @thrive_proxy_error {
    internal;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    return 503 '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No disponible</title></head><body style="font-family:system-ui,sans-serif;max-width:32rem;margin:4rem auto;padding:0 1rem;color:#333"><h1>Servicio temporalmente no disponible</h1><p>Estamos reiniciando. Espera unos segundos y recarga la página.</p></body></html>';
}
