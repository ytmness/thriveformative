# Errores de proxy (Node caído o reiniciando). Solo errores generados por Nginx, no 5xx de la app.
error_page 502 504 =503 /error-pages/503.html;

location = /error-pages/503.html {
    internal;
    alias /var/www/thriveformative/scripts/nginx/error-pages/503.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}
