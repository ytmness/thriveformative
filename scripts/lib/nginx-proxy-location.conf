# Fragmento de location / para proxy a Next.js standalone.
# Incluido por apply-nginx-proxy-only.sh (no usar directamente: requiere sustituir __PORT__).

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Evita que el navegador guarde páginas 502/503/504 durante reinicios de PM2
        add_header Cache-Control $thrive_error_cache_control always;
    }
